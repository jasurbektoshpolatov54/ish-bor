name: Telegram Mini App

# Ilovaning o‘zi (claude/project-thread-1d1pyx shoxobchasi) o‘zgarmaydi: shu yerda yig‘iladi,
# Telegram skripti qo‘shiladi va gh-pages shoxobchasiga joylanadi.
on:
  push:
    branches: [claude/project-thread-j0x9dd, claude/project-thread-1d1pyx, claude/project-thread-4cjo2w]

permissions:
  contents: write

concurrency:
  group: telegram-mini-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_REF: claude/project-thread-1d1pyx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_REF }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Stars serveri (bepul Cloudflare Worker): bot webhook'i, TOP narxi va to'lov hisoblari.
      # CLOUDFLARE_API_TOKEN bo'lmasa o'tkazib yuboriladi va ilova Starssiz yig'iladi.
      - name: Stars serveri (Cloudflare)
        id: stars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_INITIAL_CODE: ${{ secrets.ADMIN_INITIAL_CODE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN yo‘q: Stars to‘lovi o‘chiq"; exit 0; fi
          if [ -z "$TOKEN" ]; then echo "::error::TELEGRAM_BOT_TOKEN yo‘q"; exit 1; fi
          node worker/test.mjs
          CF=https://api.cloudflare.com/client/v4
          cf() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          ACC=$(cf "$CF/accounts" | jq -r '.result[0].id // empty')
          if [ -z "$ACC" ]; then echo "::error::Cloudflare kaliti hisobni ko‘rmayapti (Account Resources da hisobni tanlang)"; exit 1; fi
          SUB=$(cf "$CF/accounts/$ACC/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            SUB="mehnat-${ACC:0:6}"
            cf -X PUT "$CF/accounts/$ACC/workers/subdomain" -d "{\"subdomain\":\"$SUB\"}" | jq -c '{success, errors}'
          fi
          KV=$(cf "$CF/accounts/$ACC/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title=="mehnat-bot") | .id')
          if [ -z "$KV" ]; then KV=$(cf -X POST "$CF/accounts/$ACC/storage/kv/namespaces" -d '{"title":"mehnat-bot"}' | jq -r '.result.id // empty'); fi
          if [ -z "$KV" ]; then echo "::error::KV ombori ochilmadi"; exit 1; fi
          # MB kursi: Cloudflare'dan cbu.uz ba'zan ochilmaydi, shuning uchun bugungi kursni shu yerdan ham yozib qo'yamiz.
          J=$(curl -sS --max-time 8 https://cbu.uz/uz/arkhiv-kursov-valyut/json/USD/ || true)
          RATE=$(echo "$J" | jq -r '.[0].Rate // empty' 2>/dev/null || true)
          if [ -n "$RATE" ]; then
            DAY=$(TZ=Asia/Tashkent date +%F)
            cf -X PUT "$CF/accounts/$ACC/storage/kv/namespaces/$KV/values/rate" -H 'Content-Type: text/plain' \
              --data "$(jq -nc --arg d "$DAY" --argjson r "$RATE" --arg t "$(echo "$J" | jq -r '.[0].Date')" '{day:$d, rate:$r, date:$t, src:"cbu"}')" | jq -c '{success}'
          else echo "::warning::cbu.uz kursi olinmadi"; fi
          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY#*/}"
          cat > worker/wrangler.toml <<EOT
          name = "mehnat-bot"
          main = "bot.js"
          compatibility_date = "2024-09-23"
          account_id = "$ACC"
          workers_dev = true
          kv_namespaces = [{ binding = "STORE", id = "$KV" }]
          [vars]
          APP_URL = "https://${OWNER,,}.github.io/${NAME}/"
          TOP_SOUM = "${{ vars.TOP_SOUM || '5000' }}"
          TOP_DAYS = "${{ vars.TOP_DAYS || '7' }}"
          STAR_USD = "${{ vars.STAR_USD || '0.02' }}"
          USD_RATE_FALLBACK = "12500"
          EOT
          WH=$(printf '%s' "webhook:$TOKEN" | sha256sum | cut -c1-48)
          AH=""; if [ -n "$ADMIN_INITIAL_CODE" ]; then AH=$(printf '%s' "$ADMIN_INITIAL_CODE" | sha256sum | cut -d' ' -f1); fi
          cd worker
          npx --yes wrangler@3.114.17 deploy
          umask 077; jq -n --arg a "$TOKEN" --arg b "$WH" --arg c "$AH" '{BOT_TOKEN:$a, WEBHOOK_SECRET:$b, ADMIN_HASH:$c}' > "$RUNNER_TEMP/s.json"
          npx --yes wrangler@3.114.17 secret bulk "$RUNNER_TEMP/s.json"; rm -f "$RUNNER_TEMP/s.json"
          URL="https://mehnat-bot.$SUB.workers.dev"
          for i in $(seq 1 30); do if curl -fsS "$URL/narx" | jq -e .stars >/dev/null 2>&1; then OK=1; break; fi; sleep 10; done
          if [ -z "$OK" ]; then echo "::error::$URL javob bermadi"; exit 1; fi
          curl -fsS "$URL/narx" | jq -c . | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsS "https://api.telegram.org/bot$TOKEN/setWebhook" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$URL/tg" --arg s "$WH" '{url:$u, secret_token:$s, allowed_updates:["message","pre_checkout_query"]}')" | jq -c .
          echo "Stars serveri: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "api=$URL" >> "$GITHUB_OUTPUT"

      # Telegramga moslash: oynachalar, til tanlash, bosh sahifa yozuvi.
      # Faqat shu yig‘ishda; ilova kodidagi asl fayllar o‘zgarmaydi.
      - name: Telegramga moslash
        env:
          STARS_API: ${{ steps.stars.outputs.api }}
        run: python3 -I telegram/patch.py app

      - name: Ilovani yig‘ish
        working-directory: app
        env:
          ADMIN_INITIAL_CODE: ${{ secrets.ADMIN_INITIAL_CODE }}
        run: |
          npm ci
          npm run build
          if [ -n "$ADMIN_INITIAL_CODE" ] && grep -rqF -- "$ADMIN_INITIAL_CODE" dist; then echo "Kod ochiq holda topildi!"; exit 1; fi

      - name: Telegram skripti
        env:
          STARS_API: ${{ steps.stars.outputs.api }}
        run: |
          sed -i "s|%STARS_API%|$STARS_API|" telegram/inject.html
          awk 'FNR==NR{t=t $0 "\n"; next} /<\/head>/{printf "%s", t} 1' telegram/inject.html app/dist/index.html > index.tmp
          mv index.tmp app/dist/index.html
          grep -q telegram-web-app.js app/dist/index.html
          touch app/dist/.nojekyll

      - name: gh-pages ga joylash
        run: |
          cd app/dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Mini App: ${{ env.APP_REF }} @ $(git -C .. rev-parse --short HEAD)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Bot menyusiga ulash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::TELEGRAM_BOT_TOKEN yo‘q"; exit 1; fi
          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY#*/}"
          URL="https://${OWNER,,}.github.io/${NAME}/"
          API="https://api.telegram.org/bot$TOKEN"
          # Pages yangilanishini kutish (bir necha daqiqa olishi mumkin)
          for i in $(seq 1 30); do
            if curl -fsS "$URL" | grep -q telegram-web-app.js; then OK=1; break; fi
            sleep 20
          done
          if [ -z "$OK" ]; then
            echo "::warning::$URL ochilmadi. Settings → Pages bo‘limida Branch: gh-pages tanlanganini tekshiring."
            exit 1
          fi
          curl -fsS "$API/getMe" | jq -r '"Bot: @" + .result.username'
          curl -fsS "$API/setChatMenuButton" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$URL" '{menu_button:{type:"web_app",text:"Ochish",web_app:{url:$u}}}')" | jq -c .
          echo "Mini App manzili: $URL" >> "$GITHUB_STEP_SUMMARY"
          # Server yo'q, shuning uchun bot /start ga javob bermaydi. Buning o'rniga
          # bo'sh chatda va bot profilida "Ochish" tugmasini ko'rsatuvchi tavsif chiqadi.
          desc() {
            curl -fsS "$API/setMyDescription" -H 'Content-Type: application/json' -d "$(jq -nc --arg d "$1" --arg l "$3" '{description:$d,language_code:$l}')" | jq -c .
            curl -fsS "$API/setMyShortDescription" -H 'Content-Type: application/json' -d "$(jq -nc --arg d "$2" --arg l "$3" '{short_description:$d,language_code:$l}')" | jq -c .
          }
          desc $'Halol mehnat, vositachisiz. Bir-biringizni to‘g‘ridan-to‘g‘ri toping.\n\n👇 Ilovani ochish uchun pastdagi «Ochish» tugmasini bosing.' \
               'Halol mehnat, vositachisiz. Ilovani pastdagi «Ochish» tugmasi bilan oching.' ''
          desc $'Честный труд, без посредников. Находите друг друга напрямую.\n\n👇 Чтобы открыть приложение, нажмите кнопку «Ochish» внизу.' \
               'Честный труд, без посредников. Откройте приложение кнопкой «Ochish» внизу.' 'ru'
