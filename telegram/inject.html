<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
.tgm{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.55);font:15px/1.4 Inter,system-ui,sans-serif}
.tgm-b{width:100%;max-width:340px;border-radius:16px;padding:18px;background:var(--tg-theme-secondary-bg-color,#1c1c22);color:var(--tg-theme-text-color,#f2f2f5);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.tgm-m{white-space:pre-wrap;margin:0 0 14px;max-height:50vh;overflow:auto}
.tgm-i{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid var(--tg-theme-hint-color,#555);background:var(--tg-theme-bg-color,#0b0b0e);color:inherit;font:inherit;margin-bottom:14px;outline:none}
.tgm-r{display:flex;gap:10px;justify-content:flex-end}
.tgm-r button{flex:1;padding:12px;border:0;border-radius:10px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.tgm-ok{background:var(--tg-theme-button-color,#E6C07A);color:var(--tg-theme-button-text-color,#111)}
.tgm-no{background:transparent;color:var(--tg-theme-hint-color,#999)}
</style>
<script>
(function () {
  var w = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(w && w.initData);
  // Telegram ichida brauzer oynachalari (prompt/confirm/alert) ishonchli emas,
  // shuning uchun ilova ichida o'z oynachamiz chiqadi. Telegramdan tashqarida o'zgarish yo'q.
  function box(msg, withInput, value, withCancel) {
    return new Promise(function (res) {
      var o = document.createElement('div'); o.className = 'tgm';
      var b = document.createElement('div'); b.className = 'tgm-b'; o.appendChild(b);
      var m = document.createElement('p'); m.className = 'tgm-m'; m.textContent = msg; b.appendChild(m);
      var i = null;
      if (withInput) { i = document.createElement('input'); i.className = 'tgm-i'; i.value = value || ''; b.appendChild(i); }
      var r = document.createElement('div'); r.className = 'tgm-r'; b.appendChild(r);
      function done(v) { o.remove(); res(v); }
      if (withCancel) { var n = document.createElement('button'); n.className = 'tgm-no'; n.textContent = '✕'; n.onclick = function () { done(withInput ? null : false); }; r.appendChild(n); }
      var k = document.createElement('button'); k.className = 'tgm-ok'; k.textContent = 'OK'; k.onclick = function () { done(withInput ? i.value : true); }; r.appendChild(k);
      if (i) i.onkeydown = function (e) { if (e.key === 'Enter') k.click(); };
      document.body.appendChild(o);
      setTimeout(function () { (i || k).focus(); }, 50);
    });
  }
  function short(msg) { return String(msg).length <= 250; }
  window.__tg = inTg ? {
    prompt: function (msg, value) { return box(msg, true, value, true); },
    confirm: function (msg) {
      if (!short(msg)) return box(msg, false, '', true);
      return new Promise(function (res) { try { w.showConfirm(msg, function (ok) { res(!!ok); }); } catch (e) { box(msg, false, '', true).then(res); } });
    },
    alert: function (msg) {
      if (!short(msg)) return box(msg, false, '', false);
      return new Promise(function (res) { try { w.showAlert(msg, function () { res(); }); } catch (e) { box(msg, false, '', false).then(res); } });
    },
  } : {
    prompt: function (msg, value) { return Promise.resolve(window.prompt(msg, value)); },
    confirm: function (msg) { return Promise.resolve(window.confirm(msg)); },
    alert: function (msg) { window.alert(msg); return Promise.resolve(); },
  };
  if (!inTg) return;
  w.ready();
  w.expand();
  try { w.disableVerticalSwipes(); } catch (e) {}
})();
</script>
